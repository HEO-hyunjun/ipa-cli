name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/bundle-cli.mjs

      - run: cp dist/release/ipa-cli.js ipa-cli.js && sha256sum ipa-cli.js > SHA256SUMS

      - name: Verify standalone CLI and harness templates
        run: |
          node ipa-cli.js --version
          probe_home="$(mktemp -d)"
          cp -R packages/test-vaults/fixtures/mini-vault "$probe_home/vault"
          IPA_HARNESS_HOME="$probe_home" node ipa-cli.js --vault "$probe_home/vault" harness install codex --without prompt
          IPA_HARNESS_HOME="$probe_home" node ipa-cli.js --vault "$probe_home/vault" harness update codex --without prompt

      - run: gh release create "$GITHUB_REF_NAME" ipa-cli.js SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

name: Release Obsidian Plugin

on:
  push:
    tags:
      - "obsidian-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/build.mjs && node scripts/build-obsidian.mjs

      - run: cd packages/obsidian/dist && sha256sum main.js manifest.json styles.css versions.json > SHA256SUMS

      - run: >
          gh release create "$GITHUB_REF_NAME"
          packages/obsidian/dist/main.js
          packages/obsidian/dist/manifest.json
          packages/obsidian/dist/styles.css
          packages/obsidian/dist/versions.json
          packages/obsidian/dist/SHA256SUMS
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

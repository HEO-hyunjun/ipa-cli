name: Release Obsidian Plugin

on:
  push:
    tags:
      - "obsidian-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The plugin versions independently of the CLI, so the tag is the plugin
      # version: it must match manifest.json and be listed in versions.json.
      - run: |
          tag="${GITHUB_REF_NAME#obsidian-v}"
          manifest=$(node -p "require('./packages/obsidian/manifest.json').version")
          if [ "$tag" != "$manifest" ]; then echo "tag $tag does not match manifest.json $manifest"; exit 1; fi
          node -e "process.exit(require('./packages/obsidian/versions.json')[process.argv[1]] ? 0 : 1)" "$tag" \
            || { echo "versions.json does not list $tag"; exit 1; }

      - run: pnpm run typecheck

      - run: node scripts/build.mjs && node scripts/build-obsidian.mjs

      - run: cd packages/obsidian/dist && sha256sum main.js manifest.json styles.css versions.json > SHA256SUMS

      # --latest=false: "Latest" must stay on the CLI release (vX.Y.Z); installers
      # resolve the CLI through releases/latest and reject other tag shapes.
      - run: >
          gh release create "$GITHUB_REF_NAME"
          packages/obsidian/dist/main.js
          packages/obsidian/dist/manifest.json
          packages/obsidian/dist/styles.css
          packages/obsidian/dist/versions.json
          packages/obsidian/dist/SHA256SUMS
          --generate-notes
          --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
